<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1900" viewBox="0 0 1600 1900" role="img" aria-labelledby="title desc">
  <title id="title">云盘 STRM 小管家 v2.1.14 OpenList 配置页方向稿</title>
  <desc id="desc">严格沿用 v2.1.14 深色紧凑工作台和 Vuetify 配置模块的方向稿，展示 OpenList 连接、Token 脱敏、连接测试、来源目录、五分钟轮询、本地 STRM 输出、显式链接模板、目录规则、可靠同步与保存操作。</desc>
  <defs>
    <filter id="shell-shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="18" stdDeviation="28" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.14"/>
    </filter>
    <style>
      .ui { font-family: "SF Pro Display", "PingFang SC", "Microsoft YaHei", sans-serif; letter-spacing: 0; }
      .mono { font-family: Consolas, "SFMono-Regular", monospace; letter-spacing: 0; }
      .title { font-size: 25px; font-weight: 500; }
      .section { font-size: 16px; font-weight: 500; }
      .body { font-size: 13px; font-weight: 400; }
      .small { font-size: 12px; font-weight: 400; }
      .label { font-size: 11px; font-weight: 600; }
      .tiny { font-size: 10px; font-weight: 400; }
