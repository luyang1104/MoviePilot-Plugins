<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">云盘 Strm 小管家路径规则编辑方向</title>
  <desc id="desc">路径规则列表上打开一个分步编辑抽屉，突出路径映射与集中保存交互。</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="12" stdDeviation="22" flood-color="#182640" flood-opacity="0.12"/></filter>
    <filter id="light" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="7" flood-color="#1d2b42" flood-opacity="0.07"/></filter>
    <style>
      .ui { font-family: "Microsoft YaHei UI", "Microsoft YaHei", sans-serif; fill: #24314a; }
      .muted { fill: #66758c; } .faint { fill: #8d99aa; }
      .label { font-size: 13px; font-weight: 700; letter-spacing: 0; }
      .body { font-size: 14px; font-weight: 400; letter-spacing: 0; }
      .small { font-size: 12px; font-weight: 400; letter-spacing: 0; }
      .title { font-size: 24px; font-weight: 700; letter-spacing: 0; }
      .section { font-size: 17px; font-weight: 700; letter-spacing: 0; }
    </style>
  </defs>
  <rect width="1600" height="1000" fill="#e7edf3"/>
  <rect x="52" y="42" width="1496" height="916" rx="14" fill="#fbfcfe" filter="url(#shadow)"/>

  <!-- Persistent shell -->
  <rect x="52" y="42" width="248" height="916" rx="14" fill="#15243a"/>
  <rect x="286" y="42" width="14" height="916" fill="#15243a"/>
  <rect x="78" y="76" width="34" height="34" rx="8" fill="#d87348"/><path d="M88 94h14M95 87v14" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/>
  <text class="ui" x="125" y="91" fill="#fff" font-size="16" font-weight="700">云盘 Strm</text><text class="ui" x="125" y="109" fill="#aebbd0" font-size="12">小管家</text>
  <text class="ui small" x="78" y="164" fill="#8d9bb3" font-weight="700">同步管理</text>
  <path d="M91 197h14M98 190v14" fill="none" stroke="#b9c6d7" stroke-width="1.8" stroke-linecap="round"/><text class="ui body" x="122" y="205" fill="#c9d3e1">同步工作台</text>
  <rect x="68" y="230" width="216" height="44" rx="7" fill="#27435b"/><rect x="68" y="230" width="4" height="44" rx="2" fill="#e79851"/>
  <path d="M91 246h14v12H91zM94 243h8" fill="none" stroke="#fff" stroke-width="1.7" stroke-linejoin="round"/><text class="ui body" x="122" y="257" fill="#fff" font-weight="700">路径规则</text>
  <path d="M98 295a7 7 0 1 0 0 14 7 7 0 0 0 0-14zm0-5v4m0 16v4m-12-12h4m16 0h4m-16-8 2.6 2.6m8.8 8.8 2.6 2.6m0-14-2.6 2.6m-8.8 8.8-2.6 2.6" fill="none" stroke="#b9c6d7" stroke-width="1.5" stroke-linecap="round"/><text class="ui body" x="122" y="309" fill="#c9d3e1">运行设置</text>

  <!-- Page behind drawer -->
  <text class="ui title" x="348" y="96">路径规则</text><text class="ui body muted" x="348" y="124">管理来源目录、STRM 输出位置与云盘路径映射。</text>
  <rect x="348" y="166" width="792" height="78" rx="8" fill="#fff" stroke="#dbe3eb"/>
  <text class="ui section" x="372" y="198">4 条规则</text><text class="ui small muted" x="372" y="220">3 条正在监控，1 条停用</text>
  <rect x="932" y="184" width="184" height="40" rx="6" fill="#2d6073"/><path d="M955 204h14m-7-7v14" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round"/><text class="ui label" x="982" y="209" fill="#fff">新增路径规则</text>
  <rect x="348" y="270" width="792" height="564" rx="8" fill="#fff" stroke="#dbe3eb"/>
  <text class="ui small faint" x="372" y="305" font-weight="700">来源目录</text><text class="ui small faint" x="600" y="305" font-weight="700">输出目录</text><text class="ui small faint" x="843" y="305" font-weight="700">状态</text><text class="ui small faint" x="1015" y="305" font-weight="700">操作</text>
  <line x1="372" y1="323" x2="1116" y2="323" stroke="#e4eaf0"/>
  <rect x="360" y="342" width="768" height="101" rx="6" fill="#f4f8fb"/>
  <text class="ui body" x="372" y="375" font-weight="700">/CloudNAS/CloudDrive/国产剧</text><text class="ui small muted" x="372" y="400">标签：国产剧 · 监控变更</text>
  <path d="M546 382h30m-8-8 8 8-8 8" fill="none" stroke="#8a98a9" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text class="ui body" x="600" y="375">/CloudNAS/Strm/国产剧</text><text class="ui small muted" x="600" y="400">OpenList：/media/国产剧</text>
  <rect x="843" y="363" width="61" height="25" rx="12" fill="#e6f5ed"/><circle cx="858" cy="376" r="3" fill="#48a476"/><text class="ui small" x="866" y="380" fill="#2d7052" font-weight="700">监控</text>
  <rect x="1003" y="357" width="88" height="34" rx="6" fill="#fff" stroke="#b7c6d4"/><text class="ui small" x="1025" y="379" fill="#38546b" font-weight="700">编辑</text>
  <line x1="372" y1="462" x2="1116" y2="462" stroke="#edf1f5"/>
  <text class="ui body" x="372" y="495">/CloudNAS/CloudDrive/电影</text><text class="ui small muted" x="372" y="520">标签：电影</text><path d="M546 502h30m-8-8 8 8-8 8" fill="none" stroke="#8a98a9" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text class="ui body" x="600" y="495">/CloudNAS/Strm/电影</text><text class="ui small muted" x="600" y="520">OpenList：/media/电影</text><rect x="843" y="483" width="61" height="25" rx="12" fill="#e6f5ed"/><circle cx="858" cy="496" r="3" fill="#48a476"/><text class="ui small" x="866" y="500" fill="#2d7052" font-weight="700">监控</text><rect x="1003" y="477" width="88" height="34" rx="6" fill="#fff" stroke="#b7c6d4"/><text class="ui small" x="1025" y="499" fill="#38546b" font-weight="700">编辑</text>
  <line x1="372" y1="582" x2="1116" y2="582" stroke="#edf1f5"/>
  <text class="ui body" x="372" y="615">/CloudNAS/CloudDrive/纪录片</text><text class="ui small muted" x="372" y="640">标签：纪录片 · 不监控</text><path d="M546 622h30m-8-8 8 8-8 8" fill="none" stroke="#8a98a9" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text class="ui body" x="600" y="615">/CloudNAS/Strm/纪录片</text><text class="ui small muted" x="600" y="640">OpenList：/media/纪录片</text><rect x="843" y="603" width="61" height="25" rx="12" fill="#eff2f5"/><text class="ui small" x="854" y="620" fill="#6e7d90" font-weight="700">停用</text><rect x="1003" y="597" width="88" height="34" rx="6" fill="#fff" stroke="#b7c6d4"/><text class="ui small" x="1025" y="619" fill="#38546b" font-weight="700">编辑</text>
  <rect x="348" y="860" width="792" height="48" rx="7" fill="#fff7ed" stroke="#f0d2b3"/><circle cx="374" cy="884" r="5" fill="#d87348"/><text class="ui body" x="391" y="889" fill="#935237" font-weight="700">有未保存的更改</text><text class="ui small" x="516" y="889" fill="#9c6b56">修改规则后需保存才会应用。</text>

  <!-- Drawer backdrop and drawer -->
  <rect x="1140" y="42" width="408" height="916" fill="#c9d4e0" opacity="0.34"/>
  <rect x="1140" y="42" width="408" height="916" rx="0" fill="#fff" filter="url(#shadow)"/>
  <text class="ui section" x="1172" y="86">编辑路径规则</text><text class="ui small muted" x="1172" y="109">国产剧</text>
  <rect x="1490" y="66" width="32" height="32" rx="6" fill="#f3f6f8"/><path d="M1500 76l12 12m0-12-12 12" stroke="#52657b" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="1140" y1="130" x2="1548" y2="130" stroke="#e2e8ef"/>

  <!-- Stepper -->
  <line x1="1203" y1="168" x2="1466" y2="168" stroke="#d9e1e9" stroke-width="2"/>
  <circle cx="1203" cy="168" r="14" fill="#2d6073"/><path d="M1197 168l4 4 8-9" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="1334" cy="168" r="14" fill="#e79851"/><text class="ui small" x="1330" y="172" fill="#fff" font-weight="700">2</text><circle cx="1466" cy="168" r="14" fill="#eff3f6" stroke="#cbd6df"/><text class="ui small" x="1462" y="172" fill="#6f7d90" font-weight="700">3</text>
  <text class="ui small" x="1172" y="201" fill="#456176" font-weight="700">基本信息</text><text class="ui small" x="1304" y="201" fill="#a95f36" font-weight="700">路径映射</text><text class="ui small" x="1432" y="201" fill="#748397" font-weight="700">输出方式</text>

  <text class="ui section" x="1172" y="252">定义路径映射</text><text class="ui body muted" x="1172" y="278">文件将从来源目录映射为云盘链接，并写入 STRM 目录。</text>
  <text class="ui label" x="1172" y="329">来源目录</text><rect x="1172" y="342" width="344" height="46" rx="6" fill="#fff" stroke="#b9c8d6"/><path d="M1190 359h14v12h-14zM1193 356h8" fill="none" stroke="#64788e" stroke-width="1.4"/><text class="ui body" x="1218" y="371">/CloudNAS/CloudDrive/国产剧</text>
  <path d="M1339 407v23m0 0-7-7m7 7 7-7" fill="none" stroke="#8190a0" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="ui label" x="1172" y="465">STRM 输出目录</text><rect x="1172" y="478" width="344" height="46" rx="6" fill="#fff" stroke="#b9c8d6"/><path d="M1190 495h14v12h-14zM1193 492h8" fill="none" stroke="#64788e" stroke-width="1.4"/><text class="ui body" x="1218" y="507">/CloudNAS/Strm/国产剧</text>
  <text class="ui label" x="1172" y="570">OpenList 云盘目录</text><rect x="1172" y="583" width="344" height="46" rx="6" fill="#fff" stroke="#b9c8d6"/><path d="M1190 600h14v12h-14zM1193 597h8" fill="none" stroke="#64788e" stroke-width="1.4"/><text class="ui body" x="1218" y="612">/media/国产剧</text>
  <rect x="1172" y="661" width="344" height="82" rx="7" fill="#f4f8fb" stroke="#d7e2eb"/><text class="ui label" x="1190" y="690">映射预览</text><text class="ui small muted" x="1190" y="716">国产剧/第 01 集.mkv</text><path d="M1336 711h18m-6-6 6 6-6 6" fill="none" stroke="#5c7388" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text class="ui small" x="1364" y="716" fill="#365a70">国产剧/第 01 集.strm</text>
  <line x1="1140" y1="826" x2="1548" y2="826" stroke="#e2e8ef"/>
  <rect x="1172" y="854" width="92" height="40" rx="6" fill="#fff" stroke="#bdc9d5"/><text class="ui label" x="1200" y="879" fill="#4c6076">取消</text><rect x="1274" y="854" width="242" height="40" rx="6" fill="#2d6073"/><text class="ui label" x="1357" y="879" fill="#fff">保存更改</text>
  <text class="ui small muted" x="1172" y="924">保存后才会应用到下一次同步。</text>
</svg>
