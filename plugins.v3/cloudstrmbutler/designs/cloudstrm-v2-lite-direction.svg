<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="2420" viewBox="0 0 1800 2420" role="img" aria-labelledby="title desc">
  <title id="title">云盘 STRM 小管家轻量版设计方向</title>
  <desc id="desc">一个轻量 MoviePilot 插件运行页，包含直观数据、全量生成小弹窗和失败详情抽屉。</desc>
