  <rect x="70" y="2392" width="1660" height="1" fill="#cbd6df"/><text class="ui small" x="70" y="2412" fill="#66758c">轻量版原则：不新增复杂导航 · 不展示后台实现 · 不做图表和实时动画 · 保留去重、有限重试和重启恢复</text>
